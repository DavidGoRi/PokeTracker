<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeTracker</title>
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="theme-color" content="#d62839">
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#1d1f24;--sub:#6b7280;--borde:#e2e5ea;--acento:#d6336c;--ok:#2f9e44;--okbg:#e9f7ec}
:root[data-theme=dark]{--bg:#15171c;--card:#1e2128;--txt:#e9eaee;--sub:#9aa1ad;--borde:#2c3039;--acento:#f06595;--ok:#51cf66;--okbg:#1d3324}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--borde);padding:12px 16px}
.cabecera{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cabecera .fila{flex:1 1 auto;min-width:0;flex-wrap:nowrap}
.cabecera select{min-width:0;flex:1 1 auto;text-overflow:ellipsis}
@media (max-width:600px){h1{font-size:18px}#tema{padding:6px 10px}}
h1{margin:0;font-size:20px}
h1.titulo{display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap}
.logo{width:36px;height:36px;flex:none;overflow:visible}
.logo-cuerpo{transform-origin:32px 60px;animation:logoSalto 4s ease-in-out infinite}
.logo-halo{opacity:0;animation:logoHalo 2.4s ease-in-out infinite}
.logo-lente{animation:logoLente 2.4s ease-in-out infinite}
.logo-luz{animation:logoLuz 1.5s steps(1) infinite}
.logo-luz.l2{animation-delay:.5s}.logo-luz.l3{animation-delay:1s}
.logo-bola{transform-origin:32px 45px;animation:logoBola 2.4s ease-in-out infinite}
.logo-escaner{animation:logoEscaner 2.4s linear infinite}
h1.titulo:hover .logo-cuerpo{animation-duration:.8s}
@keyframes logoSalto{0%,80%,100%{transform:translateY(0) rotate(0)}86%{transform:translateY(-4px) rotate(-6deg)}92%{transform:translateY(0) rotate(4deg)}}
@keyframes logoHalo{0%,100%{opacity:0}50%{opacity:.55}}
@keyframes logoLente{0%,100%{fill:#2b9be8}50%{fill:#5fc3ff}}
@keyframes logoLuz{0%{opacity:1}33%{opacity:.25}}
@keyframes logoBola{0%,40%,100%{transform:rotate(0)}48%{transform:rotate(-18deg)}56%{transform:rotate(15deg)}64%{transform:rotate(-8deg)}72%{transform:rotate(0)}}
@keyframes logoEscaner{0%{transform:translateY(-3px)}100%{transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.logo *{animation:none!important}}
@media (max-width:600px){.logo{width:30px;height:30px}}
select{padding:7px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--bg);color:var(--txt);font:inherit;font-weight:600;max-width:100%}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pestanas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button{border:1px solid var(--borde);background:var(--bg);color:var(--txt);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
.pestanas button.activa,.filtros button.activa{background:var(--acento);border-color:var(--acento);color:#fff}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=search]{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--bg);color:var(--txt);font:inherit}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.opciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opciones select{font-weight:500;font-size:14px;flex:1 1 150px;min-width:0}
@media (max-width:600px){header{position:static}}
.etiquetas{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.excl{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;border:1px solid}
.excl.v0{color:#e8590c;border-color:#e8590c}
.excl.v1{color:#7048e8;border-color:#7048e8}
:root[data-theme=dark] .excl.v0{color:#ff922b;border-color:#ff922b}
:root[data-theme=dark] .excl.v1{color:#b197fc;border-color:#b197fc}
.evoaviso{font-size:11px;color:var(--acento);font-weight:600}
.estrella{position:absolute;right:4px;bottom:4px;border:0;background:none;padding:2px 4px;font-size:17px;line-height:1;color:var(--sub);opacity:.55;border-radius:6px}
.estrella:hover{opacity:1}
.estrella.si{color:#f4b400;opacity:1;text-shadow:0 0 6px rgba(244,180,0,.6)}
.poke.shiny{box-shadow:inset 0 0 0 1px #f4b400}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:4px 0 6px}
.info b{color:var(--sub);font-weight:600}
.tareas{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.tareas td{padding:5px 6px;border-top:1px solid var(--borde);vertical-align:middle}
.tareas td.n{text-align:center;width:34px;color:var(--sub);font-variant-numeric:tabular-nums}
.tareas .x2{font-size:10px;font-weight:700;color:#fff;background:var(--acento);border-radius:6px;padding:1px 5px;margin-left:4px;white-space:nowrap}
@media (max-width:600px){.tareas td.n{width:24px;padding:5px 2px}}
.progreso{margin-top:10px;font-size:14px;color:var(--sub)}
.pista{height:8px;background:var(--borde);border-radius:4px;overflow:hidden;margin-top:4px}
.pista div{height:100%;background:var(--ok);transition:width .3s}
main{padding:16px;max-width:1200px;margin:0 auto}
.aviso{background:var(--card);border:1px solid var(--borde);border-left:4px solid var(--acento);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.aviso b{color:var(--acento)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
@media (max-width:600px){.rejilla{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.poke{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;position:relative}
.poke img{width:56px;height:56px;object-fit:contain;flex:none;filter:grayscale(1) opacity(.45)}
.poke.cap{background:var(--okbg);border-color:var(--ok)}
.poke.cap img{filter:none}
.poke .num{font-size:12px;color:var(--sub)}
.poke .nom{font-weight:600;font-size:14px;overflow-wrap:break-word;min-width:0}
.poke .chk{position:absolute;top:6px;right:8px;color:var(--ok);font-weight:700;display:none}
.poke.cap .chk{display:block}
.poke .exc{font-size:11px;color:var(--sub)}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.vacio{text-align:center;color:var(--sub);padding:30px}
.tipos{display:flex;flex-direction:column;gap:3px;margin-left:auto;align-self:center;padding-right:14px}
.tipo{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:999px;padding:2px 7px;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.35);white-space:nowrap;min-width:52px;line-height:1.4}
.modal h2 .tipos{flex-direction:row;margin-left:4px;padding:0}
.modal h2 .tipo{font-size:11px}
.t-Normal{background:#9fa19f}.t-Fuego{background:#e62829}.t-Agua{background:#2980ef}.t-Planta{background:#3fa129}
.t-Eléctrico{background:#d4a800}.t-Hielo{background:#3dcef3}.t-Lucha{background:#ff8000}.t-Veneno{background:#9141cb}
.t-Tierra{background:#915121}.t-Volador{background:#81b9ef}.t-Psíquico{background:#ef4179}.t-Bicho{background:#91a119}
.t-Roca{background:#afa981}.t-Fantasma{background:#704170}.t-Dragón{background:#5060e1}.t-Siniestro{background:#624d4e}
.t-Acero{background:#60a1b8}.t-Hada{background:#ef70ef}
@media (max-width:600px){.poke{flex-wrap:wrap;row-gap:4px}.poke .tipos{flex-direction:row;flex-wrap:wrap;flex-basis:100%;margin-left:0;padding-right:0}}
.verspawn{margin-top:4px;padding:2px 8px;font-size:12px;border-radius:6px;background:var(--card)}
.verspawn:hover{border-color:var(--acento);color:var(--acento)}
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.fondo.abierto{display:flex}
.fondo>.modal{min-width:0}
.detalle>*{min-width:0}
.linea{overflow-wrap:anywhere}
.zona{white-space:normal}
.modal{background:var(--card);color:var(--txt);border:1px solid var(--borde);border-radius:14px;width:100%;max-width:760px;padding:16px 18px 20px;position:relative}
.modal h2{margin:0 40px 4px 0;font-size:20px;display:flex;align-items:center;gap:10px}
.modal h2 img{width:56px;height:56px;object-fit:contain}
.modal h2{flex-wrap:wrap}
.vershiny{font-size:12px;padding:3px 10px;margin-left:auto;font-weight:600}
.vershiny:hover{border-color:#f4b400;color:#f4b400}
.vershiny.si{border-color:#f4b400}
.modal .sub{color:var(--sub);font-size:13px;margin-bottom:10px}
.cerrar{position:absolute;top:12px;right:12px;width:34px;height:34px;padding:0;font-size:18px;border-radius:50%}
.entrada{border-top:1px solid var(--borde);padding-top:12px;margin-top:12px}
.entrada h3{margin:0 0 6px;font-size:15px;color:var(--acento)}
.linea{margin:4px 0;line-height:1.9}
.zona{display:inline-block;border:1px solid var(--borde);background:var(--bg);color:var(--txt);border-radius:999px;padding:1px 10px;margin:0 2px;font-size:13px;cursor:pointer;white-space:nowrap}
.zona.sel{background:var(--acento);border-color:var(--acento);color:#fff}
.detalle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:600px){.detalle{grid-template-columns:1fr}}
.detalle .tit{grid-column:1/-1;font-weight:600}
.detalle .tit small{color:var(--sub);font-weight:400}
.foto,.mapa{border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--borde);min-height:120px;position:relative}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.mapa{height:230px}
.mapa.entero{height:auto}
.mapa img.m{position:absolute;max-width:none;user-select:none}
.mapa.entero img.m{position:static;width:100%;display:block}
.mapa.pixel img.m{image-rendering:pixelated}
.marca{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ff2d55;border:3px solid #fff;animation:latido 1.4s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(255,45,85,.8)}100%{box-shadow:0 0 0 16px rgba(255,45,85,0)}}
.mapa .botonmapa{position:absolute;right:6px;bottom:6px;font-size:12px;padding:3px 8px;background:var(--card);z-index:2}
.nota{grid-column:1/-1;font-size:12px;color:var(--sub)}
.seccion{margin:14px 0 4px;font-size:16px;border-top:1px solid var(--borde);padding-top:12px}
.evo{overflow-x:auto;padding:6px 0 8px}
.evo>.evonodo{width:max-content;margin:0 auto}
.evo>.evonodo.evoabanico{width:auto}
.evonodo,.evorama{display:flex;align-items:center;gap:6px}
.evoramas{display:flex;flex-direction:column;gap:8px}
.evoabanico{flex-direction:column;gap:10px}
.evoabanico>.evoramas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.evoabanico>.evoramas>.evorama{flex-direction:column;justify-content:flex-start;gap:6px;border:1px solid var(--borde);border-radius:12px;padding:10px 8px}
.evoabanico>.evoramas>.evorama>.evometodo{width:auto;max-width:none;min-width:0;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.evopoke{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:4px 8px;background:var(--bg);min-width:84px;white-space:normal}
.evopoke img{width:56px;height:56px;object-fit:contain}
.evopoke span{font-size:12px;font-weight:600}
.evopoke.actual{border-color:var(--acento);box-shadow:0 0 0 1px var(--acento)}
.evometodo{font-size:12px;color:var(--sub);width:170px;flex:none;text-align:center;line-height:1.35}
.evometodo .o{display:block;font-style:italic;opacity:.8}
.evoflecha{display:block;font-size:18px;color:var(--acento);line-height:1}
@media (max-width:600px){.evometodo{width:104px}.evopoke{min-width:70px;padding:4px}.evopoke img{width:44px;height:44px}.evoabanico>.evoramas{grid-template-columns:repeat(2,1fr)}}
.sinimg{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;color:var(--sub);font-size:13px;padding:10px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="cabecera">
    <div class="fila"><h1 class="titulo"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><clipPath id="pantallaLogo"><rect x="17" y="33" width="30" height="14" rx="2"/></clipPath></defs>
      <g class="logo-cuerpo">
        <rect x="6" y="3" width="52" height="58" rx="8" fill="#d62839" stroke="#7a0f1c" stroke-width="3"/>
        <path d="M6 22 H30 L36 16 H58" fill="none" stroke="#7a0f1c" stroke-width="3" stroke-linejoin="round"/>
        <circle class="logo-halo" cx="17" cy="13" r="9" fill="#7fd0ff"/>
        <circle cx="17" cy="13" r="7.5" fill="#fff"/>
        <circle class="logo-lente" cx="17" cy="13" r="5.5" fill="#2b9be8"/>
        <circle cx="15" cy="11" r="1.8" fill="#bfe6ff"/>
        <circle class="logo-luz l1" cx="30" cy="9" r="2.4" fill="#ff4d4d" stroke="#7a0f1c" stroke-width="1"/>
        <circle class="logo-luz l2" cx="37" cy="9" r="2.4" fill="#ffd23f" stroke="#7a0f1c" stroke-width="1"/>
        <circle class="logo-luz l3" cx="44" cy="9" r="2.4" fill="#4cd964" stroke="#7a0f1c" stroke-width="1"/>
        <rect x="13" y="29" width="38" height="22" rx="3" fill="#f2f2f2" stroke="#7a0f1c" stroke-width="2"/>
        <rect x="17" y="33" width="30" height="14" rx="2" fill="#3fbf7f"/>
        <g clip-path="url(#pantallaLogo)">
          <g class="logo-bola">
            <circle cx="32" cy="40" r="5" fill="#fff" stroke="#1d1f24" stroke-width="1.2"/>
            <path d="M27 40 A5 5 0 0 1 37 40 Z" fill="#e3350d" stroke="#1d1f24" stroke-width="1.2"/>
            <circle cx="32" cy="40" r="1.6" fill="#fff" stroke="#1d1f24" stroke-width="1.1"/>
          </g>
          <rect class="logo-escaner" x="17" y="33" width="30" height="2.5" fill="#d9ffe9" opacity=".7"/>
        </g>
      </g>
    </svg>PokeTracker</h1><select id="juego" aria-label="Juego"></select></div>
    <button id="tema"></button>
  </div>
  <div class="pestanas" id="pestanas"></div>
  <div class="barra">
    <input type="search" id="buscar" placeholder="Buscar por nombre o número…">
    <div class="filtros" id="filtros">
      <button data-f="todos" class="activa">Todos</button>
      <button data-f="faltan">Me faltan</button>
      <button data-f="cap" id="filtroCap">Capturados</button>
      <button data-f="evo" title="No los tienes, pero sí su preevolución">Por evolucionar</button>
      <button data-f="shiny">★ Variocolores</button>
    </div>
  </div>
  <div class="opciones">
    <select id="fTipo" aria-label="Tipo"></select>
    <select id="fZona" aria-label="Zona"></select>
    <select id="fVersion" aria-label="Versión"></select>
    <select id="fOrden" aria-label="Orden">
      <option value="num">Orden: número</option>
      <option value="nom">Orden: nombre</option>
      <option value="faltan">Orden: los que faltan primero</option>
    </select>
  </div>
  <div class="progreso"><span id="txtProg"></span><div class="pista"><div id="barraProg"></div></div></div>
</header>
<main>
  <div id="aviso"></div>
  <div class="rejilla" id="rejilla"></div>
  <div class="acciones">
    <button id="exportar">Guardar copia (.json)</button>
    <button id="importar">Cargar copia</button>
    <button id="borrar">Desmarcar todo este juego</button>
    <input type="file" id="fichero" accept=".json" hidden>
  </div>
</main>
<div class="fondo" id="fondo"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

  { id:'pla', nombre:'Leyendas: Arceus', clave:'pokedex-pla', marca:'Nivel 10',
    dex:[{id:'hisui', nombre:'Hisui (242)'}],
    amuleto:{ dex:'hisui', excluir:[492, 491],
      texto:'hay que tener el <b>nivel de investigación 10</b> en las entradas 1 a 240 de la Pokédex de Hisui (Arceus, Phione y Manaphy incluidos). <b>Shaymin y Darkrai no cuentan.</b> Aquí marca un Pokémon cuando llegue al nivel 10, no al capturarlo.',
      donde:'Habla con el profesor Laventon en la sede del Equipo Galaxia, en Villa Jubileo.' } },
  { id:'sv', nombre:'Escarlata / Púrpura', clave:'pokedex-sv',
    dex:[{id:'paldea', nombre:'Paldea (400)'}, {id:'kitakami', nombre:'Noroteo (200)'}, {id:'blueberry', nombre:'Arándano (243)'}],
    amuleto:{ dex:'paldea', excluir:[],
      texto:'hay que <b>capturar</b> los 400 Pokémon de la Pokédex de Paldea, después de terminar la historia. Los exclusivos de la otra versión (y Koraidon o Miraidon) se consiguen por intercambio. Las Pokédex de los DLC no cuentan.',
      donde:'Habla con Jacq, el profesor de Biología de la academia.' } }
];

// Forma regional según la Pokédex que se está viendo (Galar, Hisui, Paldea); si el Pokémon no está en ella, la de otra pestaña del juego
function forma(id){
  const tab = pestana === 'iris' ? juego.amuleto.dex : pestana;
  if (DEX[tab] && DEX[tab].some(x => x[1] === id)) return (TIPOS_FORMA[tab] || {})[id];
  const otra = juego.dex.find(d => DEX[d.id].some(x => x[1] === id));
  return otra && (TIPOS_FORMA[otra.id] || {})[id];
}
const tiposDe = id => (forma(id) || [])[2] || TIPOS[id] || [];
const nombreForma = (id, nom) => forma(id) ? `${nom} de ${forma(id)[1]}` : nom;
const htmlTipos = id => `<div class="tipos">${tiposDe(id).map(x => `<span class="tipo t-${x}">${x}</span>`).join('')}</div>`;
const img = (id, sh) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${sh ? 'shiny/' : ''}${(forma(id) || [id])[0]}.png`;
const SIN_SHINY = "this.onerror=null;this.src=this.src.replace('/shiny/','/')";   // si no hay ilustración variocolor, la normal
const $ = s => document.querySelector(s);
const leer = (k, def) => { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch(e) { return def; } };
const escribir = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

let juego = JUEGOS.find(j => j.id === leer('pokedex-juego', 'swsh')) || JUEGOS[1];
let capturados, shiny, pestana, filtro = 'todos';
let fTipo = '', fZona = '', fVersion = '', orden = leer('pokedex-orden', 'num');
let ZONAS = {};   // nombre de la zona -> Set de ids (del juego actual)

const VERSIONES = {lgpe:['Pikachu', 'Eevee'], swsh:['Espada', 'Escudo'], bdsp:['Diamante Brillante', 'Perla Reluciente'], sv:['Escarlata', 'Púrpura']};
const LISTA_TIPOS = ['Normal','Fuego','Agua','Planta','Eléctrico','Hielo','Lucha','Veneno','Tierra','Volador','Psíquico','Bicho','Roca','Fantasma','Dragón','Siniestro','Acero','Hada'];

// Preevolución de cada Pokémon (de las líneas evolutivas)
const PADRE = {};
(function recorrer(){
  const nodo = ([id, , hijos]) => hijos.forEach(([, h]) => { if (!(h[0] in PADRE)) PADRE[h[0]] = id; nodo(h); });
  Object.values(EVO).forEach(nodo);
})();
const exclusivo = id => (EXCLUSIVOS[juego.id] || {})[id];

function zonasJuego(){
  const z = {}, sp = SPAWNS[juego.id] || {};
  for (const id in sp) sp[id].forEach(([, , lineas]) => lineas.forEach(l => l.forEach(tok => {
    if (typeof tok !== 'number' || !(LOC[tok][2] || LOC[tok][3])) return;
    (z[LOC[tok][0]] = z[LOC[tok][0]] || new Set()).add(+id);
  })));
  return z;
}
function opcionesFiltros(){
  $('#fTipo').innerHTML = '<option value="">Todos los tipos</option>' + LISTA_TIPOS.map(x => `<option>${x}</option>`).join('');
  ZONAS = zonasJuego();
  $('#fZona').innerHTML = '<option value="">Todas las zonas</option>' +
    Object.keys(ZONAS).sort((a, b) => a.localeCompare(b, 'es')).map(z => `<option>${esc(z)}</option>`).join('');
  const v = VERSIONES[juego.id];
  $('#fVersion').style.display = v ? '' : 'none';
  $('#fVersion').innerHTML = v ? `<option value="">Todas las versiones</option><option value="0">Solo en ${v[0]}</option><option value="1">Solo en ${v[1]}</option><option value="ambas">Sin exclusivos</option>` : '';
  fTipo = fZona = fVersion = '';
  $('#fOrden').value = orden;
}

function cargarJuego(){
  try { capturados = new Set(JSON.parse(leer(juego.clave, '[]'))); } catch(e) { capturados = new Set(); }
  try { shiny = new Set(JSON.parse(leer(juego.clave + '-shiny', '[]'))); } catch(e) { shiny = new Set(); }
  opcionesFiltros();
  pestana = leer('pokedex-pestana-' + juego.id, juego.dex[0].id);
  if (pestana !== 'iris' && !juego.dex.some(d => d.id === pestana)) pestana = juego.dex[0].id;
  $('#pestanas').innerHTML = juego.dex.map(d => `<button data-p="${d.id}">${d.nombre}</button>`).join('')
    + `<button data-p="iris">✨ Amuleto Iris</button>`;
  $('#filtroCap').textContent = juego.marca ? 'Nivel 10' : 'Capturados';
  pintar();
}
function guardar(){ escribir(juego.clave, JSON.stringify([...capturados])); escribir(juego.clave + '-shiny', JSON.stringify([...shiny])); }

$('#juego').innerHTML = JUEGOS.map(j => `<option value="${j.id}">${j.nombre}</option>`).join('');
$('#juego').value = juego.id;
$('#juego').onchange = e => {
  juego = JUEGOS.find(j => j.id === e.target.value);
  escribir('pokedex-juego', juego.id);
  $('#buscar').value = ''; filtro = 'todos';
  cargarJuego(); window.scrollTo(0,0);
};

const requeridos = () => DEX[juego.amuleto.dex].filter(p => !juego.amuleto.excluir.includes(p[1]));

function pintar(){
  document.querySelectorAll('#pestanas button').forEach(b => b.classList.toggle('activa', b.dataset.p === pestana));
  document.querySelectorAll('#filtros button').forEach(b => b.classList.toggle('activa', b.dataset.f === filtro));
  const iris = pestana === 'iris';
  $('#filtros').style.display = iris ? 'none' : '';

  const base = iris ? requeridos() : DEX[pestana];
  const hechos = base.filter(p => capturados.has(p[1])).length;
  const nombreDex = juego.dex.find(d => d.id === juego.amuleto.dex).nombre.replace(/ \(\d+\)/, '');
  $('#txtProg').textContent = iris
    ? `Pokédex ${nombreDex === "Nacional" ? "Nacional" : "de " + nombreDex}: ${hechos} / ${base.length} (te faltan ${base.length - hechos} para el Amuleto Iris)`
    : `${juego.marca ? 'En nivel 10' : 'Capturados'}: ${hechos} / ${base.length} (${Math.round(hechos*100/base.length)} %)`
      + (base.some(p => shiny.has(p[1])) ? ` · ★ ${base.filter(p => shiny.has(p[1])).length} variocolores` : '');
  $('#barraProg').style.width = (hechos*100/base.length) + '%';

  const a = juego.amuleto;
  $('#aviso').innerHTML = iris
    ? (hechos === base.length
        ? `<div class="aviso"><b>¡Ya tienes todo lo necesario!</b> ${a.donde}</div>`
        : `<div class="aviso"><b>Amuleto Iris:</b> ${a.texto} ${a.donde} Pulsa un Pokémon para marcarlo.</div>`)
    : '';

  const q = $('#buscar').value.trim().toLowerCase();
  let items = (iris ? base.filter(p => !capturados.has(p[1])) : base)
    .filter(p => !q || p[2].toLowerCase().includes(q) || String(p[0]) === q || String(p[1]) === q);
  if (!iris) {
    if (filtro === 'faltan') items = items.filter(p => !capturados.has(p[1]));
    if (filtro === 'cap') items = items.filter(p => capturados.has(p[1]));
    if (filtro === 'evo') items = items.filter(p => !capturados.has(p[1]) && capturados.has(PADRE[p[1]]));
    if (filtro === 'shiny') items = items.filter(p => shiny.has(p[1]));
  }
  if (fTipo) items = items.filter(p => tiposDe(p[1]).includes(fTipo));
  if (fZona) items = items.filter(p => ZONAS[fZona] && ZONAS[fZona].has(p[1]));
  if (fVersion === 'ambas') items = items.filter(p => !exclusivo(p[1]));
  else if (fVersion) items = items.filter(p => exclusivo(p[1]) && String(exclusivo(p[1])[0]) === fVersion);
  if (orden === 'nom') items = [...items].sort((x, y) => nombreForma(x[1], x[2]).localeCompare(nombreForma(y[1], y[2]), 'es'));
  if (orden === 'faltan') items = [...items].sort((x, y) => capturados.has(x[1]) - capturados.has(y[1]) || x[0] - y[0]);
  const exc = new Set(a.excluir);
  const vers = VERSIONES[juego.id];
  const etiquetas = id => {
    let s = '';
    const ex = exclusivo(id);
    if (ex) s += `<span class="excl v${ex[0]}" title="${esc('Exclusivo de ' + vers[ex[0]] + (ex[1] ? '. ' + ex[1] : ''))}">Solo ${vers[ex[0]]}</span>`;
    if (!capturados.has(id) && capturados.has(PADRE[id])) s += `<span class="evoaviso">⬆ Evoluciona tu ${esc(nombreForma(PADRE[id], nombrePoke(PADRE[id])))}</span>`;
    return s ? `<div class="etiquetas">${s}</div>` : '';
  };
  $('#rejilla').innerHTML = items.length ? items.map(([n,id,nom]) => `
    <div class="poke${capturados.has(id)?' cap':''}${shiny.has(id)?' shiny':''}" data-id="${id}" title="Nacional nº ${id}">
      <img loading="lazy" src="${img(id, shiny.has(id))}" alt="${nom}" onerror="${SIN_SHINY}">
      <div><div class="num">#${String(n).padStart(3,'0')}</div><div class="nom">${nombreForma(id, nom)}</div><button class="verspawn" data-spawn="${id}">Detalles</button>${!iris && exc.has(id) && pestana === a.dex ? '<div class="exc">No cuenta para el amuleto</div>' : ''}${etiquetas(id)}</div>
      ${htmlTipos(id)}
      <span class="chk">✓</span>
      <button class="estrella${shiny.has(id) ? ' si' : ''}" data-shiny="${id}" title="${shiny.has(id) ? 'Quitar de variocolores' : 'Marcar como variocolor'}" aria-label="Variocolor">${shiny.has(id) ? '★' : '☆'}</button>
    </div>`).join('') : `<div class="vacio">${iris ? '¡No te falta ninguno!' : 'No hay resultados.'}</div>`;
}

$('#rejilla').addEventListener('click', e => {
  const sp = e.target.closest('.verspawn');
  if (sp) { abrirSpawn(+sp.dataset.spawn); return; }
  const st = e.target.closest('.estrella');
  if (st) { const sid = +st.dataset.shiny; shiny.has(sid) ? shiny.delete(sid) : shiny.add(sid); guardar(); pintar(); return; }
  const c = e.target.closest('.poke'); if (!c) return;
  const id = +c.dataset.id;
  capturados.has(id) ? capturados.delete(id) : capturados.add(id);
  guardar(); pintar();
});
$('#pestanas').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  pestana = b.dataset.p; escribir('pokedex-pestana-' + juego.id, pestana);
  pintar(); window.scrollTo(0,0);
});
$('#filtros').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ filtro = b.dataset.f; pintar(); } });
$('#buscar').addEventListener('input', pintar);
$('#fTipo').onchange = e => { fTipo = e.target.value; pintar(); };
$('#fZona').onchange = e => { fZona = e.target.value; pintar(); };
$('#fVersion').onchange = e => { fVersion = e.target.value; pintar(); };
$('#fOrden').onchange = e => { orden = e.target.value; escribir('pokedex-orden', orden); pintar(); };

/* Copia de seguridad: todos los juegos en un solo archivo */
$('#exportar').onclick = () => {
  const datos = {};
  JUEGOS.forEach(j => {
    try { datos[j.id] = JSON.parse(leer(j.clave, '[]')); } catch(e) { datos[j.id] = []; }
    try { datos[j.id + '-shiny'] = JSON.parse(leer(j.clave + '-shiny', '[]')); } catch(e) { datos[j.id + '-shiny'] = []; }
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(datos)], {type:'application/json'}));
  a.download = 'pokedex-switch.json'; a.click();
};
$('#importar').onclick = () => $('#fichero').click();
$('#fichero').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const datos = JSON.parse(await f.text());
    if (Array.isArray(datos)) escribir('pokedex-galar-capturados', JSON.stringify(datos.map(Number))); // copia antigua (solo Galar)
    else JUEGOS.forEach(j => {
      if (Array.isArray(datos[j.id])) escribir(j.clave, JSON.stringify(datos[j.id].map(Number)));
      if (Array.isArray(datos[j.id + '-shiny'])) escribir(j.clave + '-shiny', JSON.stringify(datos[j.id + '-shiny'].map(Number)));
    });
    cargarJuego();
  } catch(err) { alert('El archivo no es una copia válida.'); }
  e.target.value = '';
};
$('#borrar').onclick = () => {
  if (confirm(`¿Desmarcar todos los Pokémon de ${juego.nombre}? (Los variocolores se mantienen.)`)) { capturados.clear(); guardar(); pintar(); }
};

/* ---------- Ver Spawn ---------- */
const NOMBRE_JUEGO = {lgpe:"Let's Go, Pikachu! / Eevee!", swsh:'Espada / Escudo', bdsp:'Diamante Brillante / Perla Reluciente', pla:'Leyendas: Arceus', sv:'Escarlata / Púrpura'};
const ZOOM = {hisui:1.6, galar:1.1};          // aumento del mapa en la vista acercada
const ZOOM_PIXEL = 4;                           // mapas pequeños (Kanto y Sinnoh)
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nombrePoke(id){
  for (const d of juego.dex) { const p = DEX[d.id].find(x => x[1] === id); if (p) return p[2]; }
  return '#' + id;
}

function abrirSpawn(id){
  const datos = (typeof SPAWNS !== 'undefined' && SPAWNS[juego.id] && SPAWNS[juego.id][id]) || [];
  let h = `<button class="cerrar" id="cerrar" aria-label="Cerrar">✕</button>
    <h2><img id="imgDetalle" src="${img(id, shiny.has(id))}" alt="" onerror="${SIN_SHINY}">${esc(nombreForma(id, nombrePoke(id)))}${htmlTipos(id)}<button class="vershiny${shiny.has(id) ? ' si' : ''}" id="verShiny" data-id="${id}">${shiny.has(id) ? 'Ver normal' : '✨ Ver variocolor'}</button></h2>
    <div class="sub">Detalles en ${NOMBRE_JUEGO[juego.id]}.</div>`;
  h += datosPoke(id);
  h += lineaEvolutiva(id);
  h += tareasInvestigacion(id);
  h += `<h3 class="seccion">Dónde aparece</h3><div class="sub">Pulsa una zona para ver su foto y su posición en el mapa.</div>`;
  if (!datos.length) h += `<div class="entrada">No hay datos de dónde aparece en este juego.</div>`;
  datos.forEach(([vers, sec, lineas], i) => {
    h += `<div class="entrada"><h3>${esc(vers)}${sec ? ' · ' + esc(sec) : ''}</h3>`;
    let primera = null;
    lineas.forEach(l => {
      h += '<div class="linea">' + l.map(tok => {
        if (typeof tok === 'number') {
          if (primera === null) primera = tok;
          return `<span class="zona" data-loc="${tok}" data-ent="${i}">${esc(LOC[tok][0])}</span>`;
        }
        return esc(tok.trim());
      }).reduce((acc, s, k) => acc + (k && !/^[,:.)]/.test(s) ? ' ' : '') + s, '') + '</div>';
    });
    h += `<div class="detalle" id="det${i}" data-primera="${primera === null ? '' : primera}"></div></div>`;
  });
  $('#modal').innerHTML = h;
  $('#fondo').classList.add('abierto');
  $('#fondo').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  datos.forEach((_, i) => { const d = $('#det' + i); if (d.dataset.primera !== '') mostrarZona(i, +d.dataset.primera); });
  $('#cerrar').onclick = cerrarSpawn;
  $('#verShiny').onclick = e => {
    const b = e.currentTarget, ahora = !b.classList.contains('si');
    b.classList.toggle('si', ahora);
    b.textContent = ahora ? 'Ver normal' : '✨ Ver variocolor';
    const im = $('#imgDetalle'); im.onerror = () => { im.onerror = null; im.src = img(id, false); };
    im.src = img(id, ahora);
  };
}

function datosPoke(id){
  const r = CAPTURA[id], partes = [];
  if (r != null) {
    const dif = r >= 150 ? 'fácil' : r >= 75 ? 'normal' : r >= 30 ? 'difícil' : 'muy difícil';
    partes.push(`<span><b>Ratio de captura:</b> ${r} / 255 (${dif})</span>`);
  }
  const ex = exclusivo(id);
  if (ex) partes.push(`<span><b>Exclusivo de</b> <span class="excl v${ex[0]}">${VERSIONES[juego.id][ex[0]]}</span>${ex[1] ? ' ' + esc(ex[1]) : ''}${ex[1] && /fósil/.test(ex[1]) ? '' : ' Consíguelo por intercambio.'}</span>`);
  if (shiny.has(id)) partes.push('<span style="color:#f4b400"><b style="color:inherit">★ Lo tienes variocolor</b></span>');
  return partes.length ? `<div class="info">${partes.join('')}</div>` : '';
}

function tareasInvestigacion(id){
  if (juego.id !== 'pla' || !TAREAS[id]) return '';
  const filas = TAREAS[id].map(([t, nums, doble]) =>
    `<tr><td>${esc(t)}${doble ? '<span class="x2" title="Cuenta el doble para el nivel de investigación">×2</span>' : ''}</td>` +
    [0,1,2,3,4].map(k => `<td class="n">${nums[k] ?? ''}</td>`).join('') + '</tr>').join('');
  return `<h3 class="seccion">Tareas de investigación</h3>
    <div class="sub">Cada objetivo cumplido da 10 puntos (20 con ×2). El nivel 10 de investigación son 100 puntos.</div>
    <table class="tareas">${filas}</table>`;
}

function lineaEvolutiva(id){
  const arbol = (typeof EVO !== 'undefined') && EVO[EVO_IDX[id]];
  let h = '<h3 class="seccion">Línea evolutiva</h3>';
  if (!arbol || !arbol[2].length) return h + '<div class="sub">No evoluciona.</div>';
  let otros = false;
  const nodo = ([nid, nom, hijos]) => {
    // Con más de 2 evoluciones (Eevee, Tyrogue…): el Pokémon arriba y una cuadrícula de tarjetas debajo
    const abanico = hijos.length > 2;
    let s = `<div class="evonodo${abanico ? ' evoabanico' : ''}"><button class="evopoke${nid === id ? ' actual' : ''}" data-evo="${nid}" title="Ver detalles de ${esc(nom)}">
      <img loading="lazy" src="${img(nid, shiny.has(nid))}" alt="" onerror="${SIN_SHINY}"><span>${esc(nombreForma(nid, nom))}</span></button>`;
    if (hijos.length) {
      s += '<div class="evoramas">' + hijos.map(([met, hijo]) => {
        const lista = met[juego.id] || met['*'];
        if (lista.some(m => m.endsWith(' *'))) otros = true;
        return `<div class="evorama"><div class="evometodo">${lista.map((m, k) => (k ? '<span class="o">o</span>' : '') + esc(m)).join('')}<span class="evoflecha">${abanico ? '↓' : '→'}</span></div>${nodo(hijo)}</div>`;
      }).join('') + '</div>';
    }
    return s + '</div>';
  };
  h += `<div class="evo">${nodo(arbol)}</div>`;
  if (otros) h += '<div class="sub">* Método de otros juegos: esa evolución puede no estar disponible en este.</div>';
  return h;
}

function cerrarSpawn(){ $('#fondo').classList.remove('abierto'); document.body.style.overflow = ''; }

function mostrarZona(ent, loc){
  document.querySelectorAll(`.zona[data-ent="${ent}"]`).forEach(z => z.classList.toggle('sel', +z.dataset.loc === loc));
  const [nom, orig, foto, mapa] = LOC[loc];
  const det = $('#det' + ent);
  det.innerHTML = `<div class="tit">${esc(nom)}${orig ? ` <small>(${esc(orig)})</small>` : ''}</div>
    <div class="foto">${foto ? `<img src="${esc(foto)}" alt="Foto de ${esc(nom)}" onerror="this.parentNode.innerHTML='<div class=sinimg>No se pudo cargar la foto</div>'">` : '<div class="sinimg">No hay foto de esta zona</div>'}</div>
    <div class="mapa${mapa && MAPAS[mapa][3] ? ' pixel' : ''}" id="mapa${ent}">${mapa ? '' : '<div class="sinimg">Esta entrada no tiene una zona concreta en el mapa (por ejemplo, las teraincursiones aparecen por toda la región).</div>'}</div>
    ${mapa ? '<div class="nota">El punto rojo marca la posición aproximada de la zona.</div>' : ''}`;
  if (mapa) pintarMapa(ent, loc, false);
}

function pintarMapa(ent, loc, entero){
  const [, , , mapa, x, y] = LOC[loc];
  const [src, w, hgt, pixel] = MAPAS[mapa];
  const cont = $('#mapa' + ent);
  cont.classList.toggle('entero', entero);
  cont.innerHTML = `<img class="m" src="${src}" alt="Mapa" draggable="false"><span class="marca"></span>
    <button class="botonmapa" data-ent="${ent}" data-loc="${loc}" data-entero="${entero ? 0 : 1}">${entero ? 'Acercar' : 'Mapa entero'}</button>`;
  const im = cont.querySelector('img.m'), marca = cont.querySelector('.marca');
  if (entero) {
    marca.style.left = (x / w * 100) + '%';
    marca.style.top = (y / hgt * 100) + '%';
    return;
  }
  const cw = cont.clientWidth, ch = cont.clientHeight;
  const factor = pixel ? ZOOM_PIXEL : (ZOOM[mapa] || 1);
  const ancho = Math.max(cw, w * factor), k = ancho / w, alto = hgt * k;
  let left = cw / 2 - x * k, top = ch / 2 - y * k;
  left = Math.min(0, Math.max(cw - ancho, left));
  top = Math.min(0, Math.max(ch - alto, top));
  im.style.width = ancho + 'px'; im.style.left = left + 'px'; im.style.top = top + 'px';
  marca.style.left = (left + x * k) + 'px'; marca.style.top = (top + y * k) + 'px';
}

$('#modal').addEventListener('click', e => {
  const ev = e.target.closest('.evopoke');
  if (ev) { abrirSpawn(+ev.dataset.evo); return; }
  const z = e.target.closest('.zona');
  if (z) { mostrarZona(+z.dataset.ent, +z.dataset.loc); return; }
  const b = e.target.closest('.botonmapa');
  if (b) pintarMapa(+b.dataset.ent, +b.dataset.loc, b.dataset.entero === '1');
});
$('#fondo').addEventListener('click', e => { if (e.target.id === 'fondo') cerrarSpawn(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarSpawn(); });

cargarJuego();
</script>
