    const n = DEX[d.id].filter(p => capturados.has(p[1])).length, t = DEX[d.id].length;
    x.fillStyle = '#e6e8ef'; x.font = F(700, 32); x.fillText(d.nombre.replace(/ \(\d+\)/, '').replace(/^Nacional$/, L('Nacional', 'National')), 80, y);
    x.fillStyle = '#8b90a0'; x.textAlign = 'right'; x.fillText(`${n} / ${t}`, W - 80, y); x.textAlign = 'left';
    x.fillStyle = 'rgba(255,255,255,.1)'; x.beginPath(); x.roundRect(80, y + 18, W - 160, 18, 9); x.fill();
    if (n) { const gb = x.createLinearGradient(80, 0, W - 80, 0); gb.addColorStop(0, '#ff4d6a'); gb.addColorStop(1, '#ff8a50'); x.fillStyle = gb; x.beginPath(); x.roundRect(80, y + 18, Math.max(18, (W - 160) * n / t), 18, 9); x.fill(); }
    y += 100;
  });
  // Datos extra
  const ids = idsJuego(), sh = [...shiny].filter(i => ids.has(i)), l = evaluarLogros(false), lh = l.filter(z => logrosHechos[z.id]).length;
  const chips = [`★ ${sh.length} ${L('variocolores', 'shiny')}`, `🏆 ${lh}/${l.length} ${L('logros', 'achievements')}`];
  if (juego.alfas) chips.splice(1, 0, `α ${[...alfas].filter(i => ids.has(i)).length} ${L('alfas', 'alphas')}`);
  x.font = F(700, 30); let cxp = 80; y += 10;
  chips.forEach(t => { const cw = x.measureText(t).width + 48; x.fillStyle = 'rgba(255,255,255,.08)'; x.beginPath(); x.roundRect(cxp, y - 40, cw, 60, 30); x.fill(); x.fillStyle = '#f1f2f6'; x.fillText(t, cxp + 24, y); cxp += cw + 16; });
  // Últimos (o variocolores) con imagen
  const ult = (sh.length ? sh.slice(-6) : Object.entries(fechas).sort((a, b) => b[1] - a[1]).slice(0, 6).map(e => +e[0])).filter(i => ids.has(i));
  if (ult.length) {
    y += 70; x.fillStyle = '#8b90a0'; x.font = F(700, 28); x.fillText(sh.length ? L('Últimos variocolores', 'Latest shiny') : L('Últimas capturas', 'Latest catches'), 80, y);
    const imgs = await Promise.all(ult.map(i => cargarImg(img(i, sh.length > 0))));
    imgs.forEach((im, k) => { const px = 80 + k * 155, py = y + 25; x.fillStyle = 'rgba(255,255,255,.06)'; x.beginPath(); x.roundRect(px, py, 140, 140, 28); x.fill(); if (im) x.drawImage(im, px + 10, py + 10, 120, 120); });
  }
  x.fillStyle = '#6b7080'; x.font = F(600, 26); x.fillText('davidgori.github.io/PokeTracker · ' + new Date().toLocaleDateString(LOCALE), 80, H - 60);
  return c;
}

let EVENTOS_VIS = [];
async function avisoEventos(){
  const E = await cargarDatos('eventos.json'); if (!E) return;
  const hoy = new Date().toISOString().slice(0, 10);

  E.eventos.forEach(e => {
    const regs = (e.regiones || []).filter(([, a, b]) => b >= hoy && Math.round((new Date(a) - new Date(hoy)) / 864e5) <= 60);
    if (!regs.length) return;
    const r = regs.find(x => x[0] === 'Global') || regs[0];
    const j = JUEGOS.find(x => x.id === e.juego); if (!j) return;
    const cap = datosDe(j).cap, faltan = e.ids.filter(i => !cap.has(i));
    EVENTOS_VIS.push({e, j, reg: r, ahora: r[1] <= hoy, faltan});
  });
  EVENTOS_VIS.sort((a, b) => b.ahora - a.ahora || a.reg[1].localeCompare(b.reg[1]));
  const n = EVENTOS_VIS.filter(v => v.ahora && v.faltan.length).length;
  const btn = $('#bEventos'); btn.hidden = !EVENTOS_VIS.length;
  const p = btn.querySelector('.punto'); p.hidden = !n; p.textContent = n;
  btn.classList.toggle('hay', n > 0);
  btn.setAttribute('aria-label', n ? L(`Eventos: ${n} con Pokémon que te faltan`, `Events: ${n} with Pokémon you’re missing`) : L('Eventos', 'Events'));
}

/* ---------- Modo cazador de variocolores ----------
   Probabilidades por juego (datamine, rotomlabs.net): cada «tirada» es un intento de 1/base.
   P(variocolor) = 1 - (1 - 1/base)^tiradas. Algunos métodos tienen una probabilidad fija. */
const CAZA = {
  lgpe: {base: 4096, opciones: [
    {k: 'combo', t: L('Combo de capturas', 'Catch combo'), v: [[0, '0-10'], [3, '11-20'], [7, '21-30'], [11, '31+']]},
    {k: 'cebo', t: L('Incienso activo', 'Lure active'), si: 1}, {k: 'amuleto', t: L('Amuleto Iris', 'Shiny Charm'), si: 2}]},
  swsh: {base: 4096, metodos: [['normal', L('Salvaje', 'Wild')], ['masuda', L('Método Masuda (huevos)', 'Masuda method (eggs)')], ['dinamax', L('Aventura Dinamax', 'Dynamax Adventure')]],
    opciones: [{k: 'amuleto', t: L('Amuleto Iris', 'Shiny Charm'), si: 2}],
    fijo: c => c.metodo === 'dinamax' ? (c.amuleto ? 100 : 300) : null, extra: c => c.metodo === 'masuda' ? 5 : 0},
  bdsp: {base: 4096, metodos: [['normal', L('Salvaje', 'Wild')], ['masuda', L('Método Masuda (huevos)', 'Masuda method (eggs)')], ['radar', L('Poké Radar (cadena de 40)', 'Poké Radar (chain of 40)')]],
    opciones: [{k: 'amuleto', t: L('Amuleto Iris (solo cuenta en los huevos)', 'Shiny Charm (only affects Eggs)'), si: 2}],
    fijo: c => c.metodo === 'radar' ? 99 : null, extra: c => (c.metodo === 'masuda' ? 5 : 0) - (c.metodo !== 'masuda' && c.amuleto ? 2 : 0)},
  pla: {base: 4096, opciones: [
    {k: 'inv', t: L('Investigación', 'Research'), v: [[0, L('Sin nivel 10', 'Below level 10')], [1, L('Nivel 10', 'Level 10')], [3, L('Perfecta', 'Perfect')]]},
    {k: 'brote', t: L('Brote', 'Outbreak'), v: [[0, L('Ninguno', 'None')], [25, L('Brote masivo', 'Mass outbreak')], [12, L('Brote masivo masivo', 'Massive mass outbreak')]]},
    {k: 'amuleto', t: L('Amuleto Iris', 'Shiny Charm'), si: 3}]},
  sv: {base: 4096, metodos: [['normal', L('Salvaje', 'Wild')], ['masuda', L('Método Masuda (huevos)', 'Masuda method (eggs)')]],
    opciones: [
      {k: 'brote', t: L('Brote masivo derrotados', 'Outbreak cleared'), v: [[0, L('Ninguno', 'None')], [1, '30-59'], [2, '60+']], solo: 'normal'},
      {k: 'bocadillo', t: L('Poder Brillo (bocadillo)', 'Sparkling Power (sandwich)'), v: [[0, '—'], [1, L('Nivel 1', 'Level 1')], [2, L('Nivel 2', 'Level 2')], [3, L('Nivel 3', 'Level 3')]], solo: 'normal'},
      {k: 'amuleto', t: L('Amuleto Iris', 'Shiny Charm'), si: 2}],
    extra: c => c.metodo === 'masuda' ? 5 : 0},
  za: {base: 4096, opciones: [
    {k: 'donut', t: L('Poder Brillo (dónut)', 'Sparkling Power (donut)'), v: [[0, '—'], [1, L('Nivel 1', 'Level 1')], [2, L('Nivel 2', 'Level 2')], [3, L('Nivel 3', 'Level 3')]]},
    {k: 'amuleto', t: L('Amuleto Iris', 'Shiny Charm'), si: 3}]},
  frlg: {base: 8192, opciones: [], nota: L('En Rojo Fuego / Verde Hoja no hay forma de mejorar la probabilidad.', 'There is no way to improve the odds in FireRed / LeafGreen.')}
};
const cazaK = () => juego.clave + '-caza';
const leerCaza = () => { const c = conjunto(cazaK(), '{}') || {}; c.activas = c.activas || {}; c.hechas = c.hechas || []; return c; };
const guardarCaza = c => escribir(cazaK(), JSON.stringify(c));
function probCaza(cfg){
  const g = CAZA[juego.id]; if (!g) return null;
  const fijo = g.fijo && g.fijo(cfg); if (fijo) return fijo;
  let tiradas = 1 + (g.extra ? g.extra(cfg) : 0);
  g.opciones.forEach(o => { if (o.solo && (cfg.metodo || 'normal') !== o.solo) return; tiradas += o.v ? (+cfg[o.k] || 0) : (cfg[o.k] ? o.si : 0); });
  return 1 / (1 - Math.pow(1 - 1 / g.base, Math.max(1, tiradas)));
}
const fmtProb = d => '1/' + (d >= 100 ? Math.round(d).toLocaleString(LOCALE) : d.toLocaleString(LOCALE, {maximumFractionDigits: 1}));
function textoProgresoCaza(a){
  const d = probCaza(a.cfg), p = 1 - Math.pow(1 - 1 / d, a.n);
  return `${L('Probabilidad', 'Odds')}: <b>${fmtProb(d)}</b> · ${a.n ? L(`llevas ${(a.n / d).toLocaleString(LOCALE, {maximumFractionDigits: 2})} veces la probabilidad · un ${Math.floor(p * 100)} % de cazadores ya lo habría encontrado`,
    `you’re at ${(a.n / d).toLocaleString(LOCALE, {maximumFractionDigits: 2})}× the odds · ${Math.floor(p * 100)}% of hunters would have found it by now`) : L('aún sin encuentros', 'no encounters yet')}`;
}
function htmlCaza(id, a){
  const g = CAZA[juego.id], cfg = a.cfg;
  const ctrl = (g.metodos ? `<label>${L('Método', 'Method')} <select data-cfg="metodo">${g.metodos.map(([k, t]) => `<option value="${k}"${(cfg.metodo || 'normal') === k ? ' selected' : ''}>${t}</option>`).join('')}</select></label>` : '')
    + g.opciones.map(o => o.solo && (cfg.metodo || 'normal') !== o.solo ? '' : o.v
      ? `<label>${o.t} <select data-cfg="${o.k}">${o.v.map(([v, t]) => `<option value="${v}"${(+cfg[o.k] || 0) === v ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`
      : `<label class="chk-l"><input type="checkbox" data-cfg="${o.k}"${cfg[o.k] ? ' checked' : ''}> ${o.t}</label>`).join('');
  return `<div class="caza" data-caza="${id}">
    <div class="caza-cab"><img src="${img(id, true)}" alt="" onerror="fallo(this,${id})"><div><b>${esc(nombreForma(id, nombrePoke(id)))}</b><div class="sub" style="margin:0">${L('Desde el', 'Since')} ${fmtFecha(a.inicio)}</div></div>
      <button class="caza-borrar" data-accion="borrar" aria-label="${L('Borrar esta caza', 'Delete this hunt')}" title="${L('Borrar esta caza', 'Delete this hunt')}">🗑</button></div>
    <div class="caza-contador"><button data-accion="menos" aria-label="${L('Restar uno', 'Subtract one')}">−1</button>
      <output aria-live="polite">${a.n.toLocaleString(LOCALE)}</output>
      <button class="caza-mas" data-accion="mas" aria-label="${L('Sumar un encuentro', 'Add one encounter')}">+1</button></div>
    <div class="caza-prob">${textoProgresoCaza(a)}</div>
    <div class="caza-cfg">${ctrl}</div>
    <div class="fila-botones"><button data-accion="mas10">+10</button><button data-accion="fijar">${L('Poner cifra…', 'Set number…')}</button><button class="caza-ok" data-accion="encontrado">✨ ${L('¡Encontrado!', 'Found it!')}</button></div></div>`;
}
function abrirCazador(id){
  if (!CAZA[juego.id]) return;
  const c = leerCaza();
  if (id != null && !c.activas[id]) { c.activas[id] = {n: 0, inicio: Date.now(), cfg: {}}; guardarCaza(c); }
  const ops = opcionesPoke().filter(([i]) => !c.activas[i]);
  abrirModal(`<h2>${ICO.caza}${L('Cazador de variocolores', 'Shiny hunter')}</h2>
    <div class="sub">${L('Cuenta los encuentros (o huevos) de cada caza. La probabilidad depende del método y de lo que tengas activo en', 'Count the encounters (or Eggs) of each hunt. The odds depend on the method and on what you have active in')} ${NOMBRE_JUEGO[juego.id]}.${CAZA[juego.id].nota ? ' ' + CAZA[juego.id].nota : ''}</div>
    <div class="cmp-sel"><select id="cazaNueva" aria-label="${L('Pokémon para cazar', 'Pokémon to hunt')}"><option value="">${L('Empezar una caza nueva…', 'Start a new hunt…')}</option>${ops.map(([i, n]) => `<option value="${i}">${esc(n)}</option>`).join('')}</select></div>
    <div id="cazaLista"></div>`);
  $('#cazaNueva').onchange = e => { if (e.target.value) abrirCazador(+e.target.value); };
  pintarCazas();
}
function pintarCazas(){
  const c = leerCaza(), act = Object.entries(c.activas);
  $('#cazaLista').innerHTML = (act.length ? act.map(([i, a]) => htmlCaza(+i, a)).join('') : `<div class="entrada">${L('No tienes ninguna caza en marcha. Elige un Pokémon arriba o pulsa «Cazar variocolor» en sus Detalles.', 'You have no hunts going. Pick a Pokémon above or press "Hunt shiny" in its Details.')}</div>`)
    + (c.hechas.length ? `<h3 class="seccion">${L('Cazas terminadas', 'Finished hunts')} (${c.hechas.length})</h3><div class="listapk">${c.hechas.slice().reverse().map(h =>
      `<span class="minipk listo"><img loading="lazy" src="${img(h.id, true)}" alt="" onerror="fallo(this,${h.id})">${esc(nombreForma(h.id, nombrePoke(h.id)))} · ${h.n.toLocaleString(LOCALE)} ${L('encuentros', 'encounters')} · ${fmtProb(h.prob)} · ${new Date(h.fin).toLocaleDateString(LOCALE)}</span>`).join('')}</div>` : '');
}
function cazaActualizar(div, a){
  div.querySelector('output').textContent = a.n.toLocaleString(LOCALE);
  div.querySelector('.caza-prob').innerHTML = textoProgresoCaza(a);
  const o = div.querySelector('output'); o.classList.remove('pulso'); void o.offsetWidth; o.classList.add('pulso');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]'), div = b && b.closest('[data-caza]');
  if (!div) { const z = e.target.closest('[data-cazar]'); if (z) abrirCazador(+z.dataset.cazar); return; }
  const id = +div.dataset.caza, c = leerCaza(), a = c.activas[id]; if (!a) return;
  const acc = b.dataset.accion;
  if (acc === 'mas' || acc === 'mas10' || acc === 'menos') { a.n = Math.max(0, a.n + (acc === 'mas' ? 1 : acc === 'mas10' ? 10 : -1)); guardarCaza(c); cazaActualizar(div, a); return; }
  if (acc === 'fijar') { const v = prompt(L('¿Cuántos encuentros llevas?', 'How many encounters so far?'), a.n); if (v !== null && !isNaN(parseInt(v))) { a.n = Math.max(0, parseInt(v)); guardarCaza(c); cazaActualizar(div, a); } return; }
  if (acc === 'borrar') { if (confirm(L(`¿Borrar la caza de ${nombrePoke(id)} (${a.n} encuentros)?`, `Delete the ${nombrePoke(id)} hunt (${a.n} encounters)?`))) { delete c.activas[id]; guardarCaza(c); pintarCazas(); } return; }
  if (acc === 'encontrado') {
    c.hechas.push({id, n: a.n, prob: probCaza(a.cfg), fin: Date.now(), inicio: a.inicio}); delete c.activas[id]; guardarCaza(c);
    celebrar(L(`✨ ¡${nombrePoke(id)} variocolor tras ${a.n.toLocaleString(LOCALE)} encuentros!`, `✨ Shiny ${nombrePoke(id)} after ${a.n.toLocaleString(LOCALE)} encounters!`));
    shiny.add(id); if (!juego.marca) marcar(id, true); guardar(); pintar(); pintarCazas();
  }
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-cfg]'), div = s && s.closest('[data-caza]'); if (!div) return;
  const id = +div.dataset.caza, c = leerCaza(), a = c.activas[id]; if (!a) return;
  a.cfg[s.dataset.cfg] = s.type === 'checkbox' ? s.checked : s.dataset.cfg === 'metodo' ? s.value : +s.value;
  guardarCaza(c);
  if (s.dataset.cfg === 'metodo') { div.outerHTML = htmlCaza(id, a); } else cazaActualizar(div, a);
});
// Teclado: con el cazador abierto y una sola caza, la barra espaciadora o «+» suman uno
document.addEventListener('keydown', e => {
