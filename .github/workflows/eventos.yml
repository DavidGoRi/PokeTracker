name: Actualizar eventos

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días a las 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eventos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar eventos de Serebii
        run: python herramientas/eventos.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "PokeTracker (eventos)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/eventos.json
          git diff --cached --quiet || (git commit -m "Actualizar eventos" && git push)
